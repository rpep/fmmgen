on:
  pull_request:
  push:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14', '3.15' ]
    name: Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dependencies
        run: uv sync --all-groups
      - name: Tests
        run: uv run pytest tests --junitxml=junit/results.xml
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Python ${{ matrix.python-version }} test results
          path: junit/results.xml
          reporter: java-junit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install package and dependencies
        run: uv sync --all-groups
      - name: Install reviewdog
        uses: reviewdog/action-setup@v1
      - name: Ruff
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run ruff check --output-format=rdjson fmmgen tests | reviewdog -f=rdjson -name=ruff -reporter=github-check -filter-mode=nofilter -fail-level=any
